# Cloudflare Worker 設定（部署前先執行 node tools/build-worker.js 產生 src/gs.generated.js）
name = "shumeizi-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "DB"
class_name = "DutyStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DutyStore"]

# 每 5 分鐘一次（後台推播）；台北 07:00 與 20:00 的手機提醒也在這裡判斷（見 src/index.js）。
# Cloudflare 免費方案整個帳號最多 5 個排程，教全區已經用了 3 個，所以書槑子只用 1 個。
[triggers]
crons = ["*/5 * * * *"]

# 團購會員登入（規格 0.6.3）：公開的 ID（不是密碼）。LINE 用 LIFF，不需要 Channel secret；登入憑證金鑰 Worker 自己產生（存在 Durable Object）。
[vars]
GOOGLE_CLIENT_ID = "290583637218-dtut8et01o10684umfs58bhh30t3r4l6.apps.googleusercontent.com"
LINE_CHANNEL_ID = "2012376434"

[observability]
enabled = true
